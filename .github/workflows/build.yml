name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: unzip -q PocketMusicAndroid-fixed.zip -d project

      - name: Build APK
        run: |
          cd project/PocketMusicAndroid
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketMusic-APK
          path: project/PocketMusicAndroid/app/build/outputs/apk/debug/*.apk
